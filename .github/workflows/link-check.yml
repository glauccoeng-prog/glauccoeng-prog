name: README health

on:
  # every Monday — warns before a recruiter finds a broken link
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - assets/**

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Every image must be hosted in this repository
        run: |
          if grep -nE '(src|srcset)="https?://' README.md; then
            echo "::error::external image found in README.md"; exit 1
          fi
          for f in $(grep -oE '(src|srcset)="assets/[^"]+"' README.md | sed -E 's/.*="([^"]+)"/\1/' | sort -u); do
            test -f "$f" || { echo "::error::missing asset $f"; exit 1; }
          done
          echo "all images are local and present"

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # LinkedIn blocks bots (HTTP 999), so it is excluded to avoid false alarms
          args: >-
            --no-progress
            --max-retries 3
            --exclude 'linkedin\.com'
            README.md
          fail: true
