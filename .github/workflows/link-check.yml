name: Check README Links

on:
  # toda segunda-feira às 06:00 (UTC) — avisa ANTES de um recrutador ver link quebrado
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md

jobs:
  linkcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check links and images
        uses: lycheeverse/lychee-action@v2
        with:
          # LinkedIn bloqueia robôs (HTTP 999) — excluído para evitar falso positivo
          args: >-
            --no-progress
            --max-retries 3
            --exclude 'linkedin\.com'
            README.md
          fail: true
