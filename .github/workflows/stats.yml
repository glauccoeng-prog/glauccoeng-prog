name: Profile activity card

on:
  schedule:
    # off-the-hour minute: scheduled runs at the top of the hour are delayed by hours
    - cron: "37 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate_stats.py
      - .github/workflows/stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # writes assets/activity-*.svg only if every API call succeeded;
      # on failure it exits non-zero and the previous card stays online
      - name: Generate activity card
        run: python scripts/generate_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate SVGs
        run: |
          python - <<'PY'
          import pathlib, xml.dom.minidom
          for p in pathlib.Path("assets").glob("activity-*.svg"):
              xml.dom.minidom.parse(str(p))          # well-formed
              assert p.stat().st_size < 20_000, p   # sane size
          print("SVGs OK")
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-*.svg
          if git diff --cached --quiet; then
            echo "Card already up to date"
          else
            git commit -m "chore: update activity card"
            git pull --rebase origin main
            git push
          fi
